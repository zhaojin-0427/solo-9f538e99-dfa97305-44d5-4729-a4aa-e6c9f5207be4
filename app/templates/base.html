<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block head %}{% endblock %}
  <title>{% block title %}变异归一化{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1><a href="{{ url_for('main.index') }}">变异注释归一化平台</a></h1>
  <p class="tagline">同一变异的不同插缺写法归一 · 等价合并 · 标准 VCF 输出</p>
</header>
<main>
  {% with msgs = get_flashed_messages() %}
    {% if msgs %}
      {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>页面时间均为 UTC ｜ 报告结论以固定输入版本为准</footer>
</body>
</html>
